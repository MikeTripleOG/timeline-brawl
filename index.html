<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2012">
<title>Timeline Brawl — The Five Crowns</title>
<meta name="description" content="A tap-first top-down war game: five kingdoms, a crimson Invader, sieges, treaties and betrayal. Play solo, pass & play or online with a friend.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- title -->
  <section id="title" class="screen on splash">
    <div class="titlebg"></div>
    <!-- key art (HB.ART.titleLayers): the painting carries the title, so no title text is drawn over it -->
    <div class="ka" aria-hidden="true"><div class="ka-scene" id="kaScene"></div><div class="ka-logo" id="kaLogo"></div></div>
    <div class="ka-strip" id="kaStrip"><div class="ldbar" id="ldBar"><b id="ldFill"></b></div><button class="tapgo" id="bBegin">Tap to begin</button></div>
    <div class="titlebox">
      <div class="logo" id="logoTxt">Timeline Brawl</div>
      <div class="sublogo" id="subTxt">The Five Crowns</div>
      <div class="crestrow" id="crestRow"></div>
      <div class="trial" id="tagTxt">Trial version</div>
      <button class="btn big gold" id="bQuick">⚔ Quick Battle</button>
      <button class="btn big" id="bPlay">Play ▸</button>
      <div class="row2"><button class="btn" id="bCustom">Custom battle</button><button class="btn" id="bPreset" title="Quick Battle preset: a braced phalanx against a lancer charge">Pikes vs Charge</button></div>
      <div class="row2 row3"><button class="btn" id="bHow">How to play</button><button class="btn mute" id="bMute" aria-label="Sound on/off" aria-pressed="false">🔊</button></div>
      <div class="foot">Pre-gunpowder warfare · pike beats horse · horse beats bow · bow beats slow foot</div>
    </div>
  </section>

  <!-- campaign map -->
  <section id="map" class="screen">
    <canvas id="mapcv"></canvas>
    <div class="cartouche tl"><div class="c1">The Five Crowns</div><div class="c2">Campaign Map</div></div>
    <div class="hudR">
      <div class="panel supply"><div class="crate"></div><div><div class="lbl">Supply <span id="supTxt">78/120</span></div><div class="seg" id="supBar"></div><div class="lbl gold" id="goldTxt">Gold 0</div></div></div>
      <div class="panel turn"><div class="lbl">Turn</div><div class="num" id="turnTxt">1</div></div>
    </div>
    <div class="mapbar">
      <div class="ticker" id="ticker"></div>
      <div class="mapbtns"><button class="btn sm" id="bDiplo">Envoys</button><button class="btn sm" id="bLog">Chronicle</button><button class="btn sm" id="bMapMenu">☰</button><button class="seal gold" id="bEnd">End<br>Turn</button></div>
    </div>
    <div class="sheet" id="sheet"></div>
    <div class="waiting" id="waiting"></div>
  </section>

  <!-- battle -->
  <section id="battle" class="screen">
    <canvas id="cv"></canvas>
    <div class="cartouche tl small"><div class="c1" id="bTitle">Battle</div></div>
    <div class="hudR">
      <div class="panel morale" id="morPanel"></div>
      <div class="panel turn" id="bTurnBox"><div class="lbl" id="bTurnLbl">Timer</div><div class="num" id="timer">5:00</div></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="bbar">
      <button class="btn gold" id="bStart" style="display:none">⚔ Start battle</button>
      <button class="btn sm" id="bCurse" title="Curse meter: your army's faith / the cost of a Curse. Tap, then an enemy regiment.">☾ Curse <span class="faith" id="faith"></span></button>
      <button class="btn sm" id="bAuto">Auto</button>
      <button class="btn sm" id="bSpeed">1×</button>
      <button class="btn sm" id="bExit">✕</button>
    </div>
    <div class="banner" id="banner"><div class="bt"></div><div class="bs"></div></div>
    <div class="dipl" id="dipl"></div>
  </section>

  <!-- overlays -->
  <div class="modal" id="modal"><div class="scroll" id="modalBody"></div></div>
  <div class="cover" id="cover"></div>
  <div class="toast" id="toast"></div>
  <div class="tut" id="tut"><div class="tutbox"><div class="tutn" id="tutN"></div><div class="tutt" id="tutT"></div><div class="tutb"><button class="btn sm" id="tutSkip">Skip tips</button><button class="btn sm gold" id="tutNext">Got it</button></div></div></div>
  <div class="flourish" id="flourish"><div class="fl1"></div><div class="flt" id="flT"></div><div class="fls" id="flS"></div></div>
  <div class="fader" id="fader"></div>
</div>
<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/siege.js"></script>
<script src="js/ai.js"></script>
<script src="js/match.js"></script>
<script src="js/campaign.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/mapview.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
